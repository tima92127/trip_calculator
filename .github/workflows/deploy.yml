name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Сгенерировать config.js из секретов репозитория
        run: |
          cat > config.js <<EOF
          window.SUPABASE_URL = '${{ secrets.SUPABASE_URL }}';
          window.SUPABASE_ANON_KEY = '${{ secrets.SUPABASE_ANON_KEY }}';
          window.OCR_SPACE_API_KEY = '${{ secrets.OCR_SPACE_API_KEY }}';
          EOF

      - name: Настроить Pages
        uses: actions/configure-pages@v5

      - name: Загрузить артефакт
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Задеплоить на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
